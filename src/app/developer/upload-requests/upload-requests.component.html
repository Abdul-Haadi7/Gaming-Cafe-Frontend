<mat-toolbar>
  <span>Gaming Cafe</span>

<span class="example-spacer"></span>

  <h1>{{name}}</h1>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">

<mat-sidenav #sidenav mode="side" [opened]="false" class="app-sidenav">

<mat-nav-list>

  <a mat-list-item (click)="goToHome()">
    Home
  </a>

  <a mat-list-item>
    Pending upload requests
  </a>

  <a mat-list-item (click)="goToWarnings()">
    Received warnings
  </a>

  <a mat-list-item (click)="goToWarningEndReqs()">
    Warning end requests
  </a>

</mat-nav-list>

</mat-sidenav>

<mat-sidenav-content>

<button mat-icon-button (click)="sidenav.toggle()">
  <mat-icon>menu</mat-icon>
</button>


<div class="requests-container">

  <h2 class="marginLeft">Upload Requests</h2>

  <table mat-table [dataSource]="pendingRequests">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>
        Game Name
      </th>

      <td mat-cell *matCellDef="let req">
        {{ req.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>
        Price (PKR)
      </th>

      <td mat-cell *matCellDef="let req">
        {{ req.price }}
      </td>
    </ng-container>


    <ng-container matColumnDef="genre">
      <th mat-header-cell *matHeaderCellDef>
        Genre
      </th>

      <td mat-cell *matCellDef="let req">
        {{ req.genre }}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let req">
        <span *ngIf="req.status === 'Approved'">
          <mat-icon class="approved">check_circle</mat-icon>
          Approved
        </span>
        <span *ngIf="req.status === 'Rejected'">
          <mat-icon class="rejected">cancel</mat-icon>
          Rejected
          <br>
          Reason: {{req.rejectionReason}}
        </span>
        <span *ngIf="req.status === 'Pending'">
          <mat-icon class="pending">schedule</mat-icon>
          Pending
        </span>

      </td>
    </ng-container>

   <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let req">
        <button class = "marginRight" mat-stroked-button (click)="goToEdit(req.id)">
            Edit game
        </button>
        <button mat-stroked-button *ngIf="req.status!='Pending'" (click)="markWarningEndReqAsDontShow(req)">
            Don`t show again
        </button>
      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;">
    </tr>

  </table>

</div>

  </mat-sidenav-content>

</mat-sidenav-container>
